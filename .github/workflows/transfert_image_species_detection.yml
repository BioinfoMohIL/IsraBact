name: Build species_detection image (GHCR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        default: "2.0"
  push:
    paths:                       # rebuild when one of the baked-in files changes
      - Dockerfile
      - kmer_utils.py
      - predict_one.py
      - plate_check.py
      - specie_detection.sh
      - strain_model.pkl

jobs:
  build_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true              # in case strain_model.pkl is stored with Git LFS (GitHub refuses files > 100 MB)

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/species_detection" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ inputs.tag || '2.0' }}