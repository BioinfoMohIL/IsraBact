name: Transfert Image Perso vers GHCR
on:
  workflow_dispatch: # Déclencheur manuel (bouton clic)

jobs:
  copy_image:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, Tag et Push
        run: |
          docker pull bioinfomoh/specie_detection:1
          docker tag bioinfomoh/specie_detection:1 ghcr.io/${{ github.repository_owner }}/specie_detection:1.0
          docker push ghcr.io/${{ github.repository_owner }}/specie_detection:1.0
