<style>
 *{box-sizing:border-box}
 body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f4f6f8;color:#1f2933}
 header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:1px solid #e2e6ea}
 h1{font-size:14px;font-weight:600;margin:0;color:#3e4c59}
 .btns{margin-left:auto;display:flex;gap:8px}
 button{border:1px solid #2c3e50;background:#2c3e50;color:#fff;padding:7px 13px;border-radius:7px;font-size:13px;cursor:pointer}
 button.alt{background:#fff;color:#2c3e50} button:hover{opacity:.92}
 main{padding:16px}
 .wrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:14px;display:inline-block;overflow:auto;max-width:100%}
 svg{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
 .tip{position:fixed;pointer-events:none;background:#1f2933;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;line-height:1.35;opacity:0;transition:opacity .07s;z-index:9;box-shadow:0 2px 8px rgba(0,0,0,.25)}
 .tip b{font-weight:600}
</style>
<header>
  <h1 id="ttl"></h1>
  <div class="btns">
    <button onclick="dl('png','image/png','heatmap.png')">Download PNG</button>
    <button class="alt" onclick="dl('svg','image/svg+xml','heatmap.svg')">SVG</button>
    <button class="alt" onclick="dl('pdf','application/pdf','heatmap.pdf')">PDF</button>
  </div>
</header>
<main><div class="wrap" id="wrap"></div></main>
<div class="tip" id="tip"></div>
<script>
const SVGNS="http://www.w3.org/2000/svg";
const CELL=22, BAND=24, PADT=8, PADL=10, CHARW=6.4, FONT=11;
document.getElementById('ttl').textContent=TITLE;
function el(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
function maxlen(a){return a.reduce((m,s)=>Math.max(m,(''+s).length),0);}
function R(v){return Math.round(v);}

function render(){
  const S=DATA.samples,G=DATA.genes,C=DATA.cats,P=DATA.present,COL=DATA.colors,B=DATA.blocks;
  const n=S.length,m=G.length;
  const nameW=R(maxlen(S)*CHARW+12), geneH=R(maxlen(G)*CHARW+12);
  const treeW=(DATA.tree&&DATA.tree.segments.length)?150:0;
  const gx0=PADL+treeW+nameW, gy0=PADT+BAND;
  const W=gx0+m*CELL+PADL, H=gy0+n*CELL+geneH+PADT;
  const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,xmlns:SVGNS,id:'heat',
                      'text-rendering':'geometricPrecision'});
  svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'#ffffff'}));

  // rectangular cladogram: all tips aligned at the same level
  if(treeW){
    const rh=DATA.tree.root_h||1;
    const tx=x=>R(PADL+(rh?(x/rh)*(treeW-18):treeW/2));
    const ty=y=>R(gy0+y*CELL+CELL/2);
    const g=el('g',{stroke:'#2c3e50','stroke-width':1.1,'shape-rendering':'crispEdges',fill:'none'});
    for(const s of DATA.tree.segments)
      g.appendChild(el('line',{x1:tx(s[0]),y1:ty(s[1]),x2:tx(s[2]),y2:ty(s[3])}));
    svg.appendChild(g);
  }
  // sample names
  for(let i=0;i<n;i++){
    const t=el('text',{x:gx0-5,y:gy0+i*CELL+CELL/2+3.5,'text-anchor':'end','font-size':FONT,fill:'#3e4c59'});
    t.textContent=S[i]; svg.appendChild(t);
  }
  // category band (one colored bar per gene block) + block separators
  for(const b of B){
    const x=gx0+b.start*CELL, w=(b.end-b.start+1)*CELL;
    svg.appendChild(el('rect',{x:x,y:PADT,width:w,height:BAND-4,fill:COL[b.cat]||'#7f8c8d',
                               'shape-rendering':'crispEdges'}));
    const t=el('text',{x:x+w/2,y:PADT+(BAND-4)/2+4,'text-anchor':'middle','font-size':11,
                       'font-weight':600,fill:'#fff'}); t.textContent=b.label; svg.appendChild(t);
    if(b.end+1<m) svg.appendChild(el('line',{x1:gx0+(b.end+1)*CELL,y1:gy0,
        x2:gx0+(b.end+1)*CELL,y2:gy0+n*CELL,stroke:'#fff','stroke-width':2}));
  }
  // cells: present -> category color, absent -> white
  const cg=el('g',{}); svg.appendChild(cg);
  for(let i=0;i<n;i++)for(let j=0;j<m;j++){
    const on=P[i][j];
    const r=el('rect',{x:gx0+j*CELL,y:gy0+i*CELL,width:CELL,height:CELL,
        fill:on?(COL[C[j]]||'#7f8c8d'):'#ffffff',stroke:'#dfe4e8','stroke-width':1,
        'shape-rendering':'crispEdges'});
    r.dataset.i=i; r.dataset.j=j; cg.appendChild(r);
  }
  // gene names (vertical)
  for(let j=0;j<m;j++){
    const cx=gx0+j*CELL+CELL/2, cy=gy0+n*CELL+6;
    const t=el('text',{x:cx,y:cy,'font-size':FONT,fill:'#3e4c59','text-anchor':'end',
                       transform:`rotate(-90 ${cx} ${cy})`}); t.textContent=G[j]; svg.appendChild(t);
  }
  // hover highlight + tooltip
  const hl=el('rect',{fill:'none',stroke:'#1f2933','stroke-width':2,opacity:0}); svg.appendChild(hl);
  const hr=el('rect',{fill:'none',stroke:'#1f2933','stroke-width':2,opacity:0}); svg.appendChild(hr);
  const tip=document.getElementById('tip');
  cg.addEventListener('mousemove',e=>{
    if(e.target.tagName!=='rect')return;
    const i=+e.target.dataset.i,j=+e.target.dataset.j;
    hl.setAttribute('x',gx0+j*CELL);hl.setAttribute('y',gy0);hl.setAttribute('width',CELL);hl.setAttribute('height',n*CELL);hl.setAttribute('opacity',.5);
    hr.setAttribute('x',gx0);hr.setAttribute('y',gy0+i*CELL);hr.setAttribute('width',m*CELL);hr.setAttribute('height',CELL);hr.setAttribute('opacity',.5);
    tip.innerHTML=`<b>${S[i]}</b> &middot; ${G[j]}<br>${C[j]} &middot; ${P[i][j]?'present':'absent'}`;
    tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';tip.style.opacity=1;
  });
  cg.addEventListener('mouseleave',()=>{tip.style.opacity=0;hl.setAttribute('opacity',0);hr.setAttribute('opacity',0);});
  const wrap=document.getElementById('wrap'); wrap.innerHTML=''; wrap.appendChild(svg);
}
function dl(f,m,n){const a=document.createElement('a');a.href='data:'+m+';base64,'+ASSETS[f];a.download=n;document.body.appendChild(a);a.click();a.remove();}
render();
</script></body></html>
